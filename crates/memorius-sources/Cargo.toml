[package]
name = "memorius-sources"
version = "0.1.4"
description = "Memorius platform recorders and context readers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
memorius-core = { path = "../memorius-core", default-features = false }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
ureq = { version = "3.4.2", features = ["json"] }

[features]
# The session importer and the shared read models use the SQLite store.
store = ["memorius-core/store"]

[[example]]
name = "import"
required-features = ["store"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSURL",
  "NSData",
  "NSDictionary",
  "NSGeometry",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "NSWorkspace",
  "NSRunningApplication",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphicsContext",
  "objc2-core-graphics",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "HIServices",
  "AXUIElement",
  "AXError",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFString",
  "CFDictionary",
  "CFNumber",
  "CFBase",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGEventSource",
  "CGEventTypes",
  "CGSession",
  "CGImage",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
] }
png = "0.18"

[lints]
workspace = true
