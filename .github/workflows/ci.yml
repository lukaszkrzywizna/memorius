name: CI

# The full preflight on macOS and Windows: weekly when main changed, or by
# hand. checks.yml covers every push and pull request on Linux.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: main changed this week
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log -1 --since='7 days ago' --format=%H)" ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: preflight (${{ matrix.os }})
    needs: changed
    if: needs.changed.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            skip: ""
          # Preflight self-tests and the layer check do not depend on the
          # platform; macOS covers them.
          - os: windows-latest
            skip: "--skip harness-test,architecture"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - run: pnpm install --frozen-lockfile
      - run: node tooling/harness/preflight.mjs ${{ matrix.skip }}
      - name: Upload preflight logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preflight-logs-${{ matrix.os }}
          path: .preflight/
