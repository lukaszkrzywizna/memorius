name: Release

# Windows only, by hand: macOS releases are built on a Mac with
# `pnpm release:mac`. Builds the signed Windows installer (with the `memorius`
# CLI inside) from an existing tag and adds it, and its entry in `latest.json`,
# to that tag's GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.3
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile

      - name: Build the memorius CLI that ships inside the app
        run: node tooling/build-cli-sidecar.mjs x86_64-pc-windows-msvc

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag }}
          releaseName: Memorius ${{ inputs.tag }}
          releaseBody: See the README for installation steps.
          args: >-
            --target x86_64-pc-windows-msvc
            --config src-tauri/tauri.bundle.conf.json
            --config {"bundle":{"createUpdaterArtifacts":true}}
