  '@base-ui/react': 1.8.0
  class-variance-authority: 0.7.1
  cn: 0.4.0
  '@eslint/js': 10.0.1
  lucide-react: 1.53.0
  shadcn: 4.23.0
  '@storybook/addon-a11y': 10.6.7
  '@storybook/react-vite': 10.6.7
  '@tailwindcss/vite': 4.3.3
  '@tanstack/eslint-plugin-query': 5.101.4
  '@tanstack/react-query': 5.101.4
  '@tanstack/react-router': 1.170.18
  '@tanstack/router-plugin': 1.168.23
  '@tauri-apps/api': 2.12.1
  '@tauri-apps/cli': 2.12.1
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.2
  tw-animate-css: 1.4.0
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@typescript/native': npm:typescript@7.0.2
  '@vitejs/plugin-react': 6.1.0
  '@vitest/coverage-v8': 4.1.12
  '@vitest/eslint-plugin': 1.6.27
  dependency-cruiser: 18.2.0
  eslint: 10.8.1
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-import-x: 4.17.1
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-oxlint: 1.79.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-storybook: 10.6.7
  eslint-plugin-testing-library: 7.16.2
  globals: 17.11.0
  jsdom: 30.0.1
  knip: 6.32.2
  lefthook: 2.1.10
  oxfmt: 0.64.0
  oxlint: 1.79.0
  oxlint-tsgolint: 7.0.2001
  react: 19.2.8
  react-dom: 19.2.8
  storybook: 10.6.7
  tailwindcss: 4.3.3
  typescript: npm:@typescript/typescript6@6.0.2
  typescript-eslint: 8.67.0
  vite: 8.2.6
  vitest: 4.1.12
  zod: 4.6.7

catalogMode: strict

cleanupUnusedCatalogs: true

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

# Security fixes that a parent's version range still holds back.
overrides:
  'undici@>=8.0.0 <8.12.2': 8.12.4
  'tinypool@<2.1.2': 2.1.2
  'glob@>=9.0.0 <14.0.2': 14.0.6
  'minimatch@>=7.0.0 <11.0.1': 11.0.8
